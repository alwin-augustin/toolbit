    <!--
      Styles for the crawlable pre-render below. The markup inside #root is
      injected at build time by scripts/generate-seo-pages.mjs and is replaced
      by the React app as soon as it mounts, so this only ever paints during
      the first few hundred milliseconds — or permanently, for a crawler that
      does not execute JavaScript.
    -->
    <style>
        .tb-boot {
            --tb-bg: #ffffff;
            --tb-fg: #14161a;
            --tb-muted: #5b6070;
            --tb-line: #e3e5ea;
            --tb-accent: #2f52c8;
            box-sizing: border-box;
            max-width: 62rem;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
            background: var(--tb-bg);
            color: var(--tb-fg);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.6;
        }
        html.dark .tb-boot {
            --tb-bg: #17181c;
            --tb-fg: #eceef3;
            --tb-muted: #a1a6b4;
            --tb-line: #2b2d34;
            --tb-accent: #93a9ff;
        }
        .tb-boot *, .tb-boot *::before, .tb-boot *::after { box-sizing: inherit; }
        .tb-boot h1 { font-size: clamp(1.9rem, 4vw, 2.75rem); line-height: 1.15; margin: 0 0 1rem; letter-spacing: -0.02em; }
        .tb-boot h2 { font-size: 1.25rem; margin: 2.25rem 0 0.5rem; letter-spacing: -0.01em; }
        .tb-boot h3 { font-size: 1rem; margin: 0 0 0.25rem; }
        .tb-boot p { margin: 0 0 1rem; color: var(--tb-muted); }
        .tb-boot a { color: var(--tb-accent); text-decoration: none; }
        .tb-boot a:hover { text-decoration: underline; }
        .tb-boot ul, .tb-boot ol { margin: 0 0 1rem; padding-left: 1.15rem; color: var(--tb-muted); }
        .tb-boot li { margin: 0.2rem 0; }
        .tb-boot-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 650; font-size: 1.1rem; margin-bottom: 2rem; }
        .tb-boot-brand img { width: 28px; height: 28px; }
        .tb-boot-lede { font-size: 1.05rem; max-width: 46rem; }
        .tb-boot-links { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; padding: 0; margin: 0 0 1rem; list-style: none; }
        .tb-boot-links li { margin: 0; }
        .tb-boot-links a { display: inline-block; padding: 0.3rem 0.7rem; border: 1px solid var(--tb-line); border-radius: 999px; font-size: 0.9rem; }
        .tb-boot-grid { display: grid; gap: 1.25rem 2rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); margin-bottom: 0.5rem; }
        .tb-boot-faq dt { font-weight: 600; margin-top: 0.9rem; }
        .tb-boot-faq dd { margin: 0.15rem 0 0; color: var(--tb-muted); }
        .tb-boot-footer { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--tb-line); font-size: 0.9rem; color: var(--tb-muted); }
        .tb-boot-footer a { margin-right: 1rem; display: inline-block; }
    </style>
