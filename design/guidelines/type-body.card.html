<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 12px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .specimen { color:hsl(var(--text-strong)); }
</style>
</head>
<body>
<div style="display:grid;gap:9px;max-width:560px">
  <div class="specimen" style="font-size:var(--text-md)">16 · Emphasized body — privacy-first by design.</div>
  <div style="font-size:var(--text-base);color:hsl(var(--text-body))">14 · Default UI text. Toolbit runs entirely on your device, with zero tracking.</div>
  <div style="font-size:var(--text-sm);color:hsl(var(--text-muted))">13 · Secondary text and descriptions.</div>
  <div style="font-size:var(--text-xs);color:hsl(var(--text-faint))">12 · Meta, captions, timestamps</div>
  <div style="font-size:var(--text-2xs);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:hsl(var(--text-faint))">11 · Uppercase eyebrow</div>
</div></body></html>
