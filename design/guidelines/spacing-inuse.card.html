<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing — In Use" subtitle="Card padding 24, gaps 12; layout primitives" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 12px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
</style>
</head>
<body>
<div style="display:flex;gap:var(--space-3)">
  <div style="flex:1;padding:var(--space-6);background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-lg)">
    <div style="font-weight:600;color:hsl(var(--text-strong));margin-bottom:var(--space-2)">Panel</div>
    <div style="font-size:13px;color:hsl(var(--text-muted))">padding 24 (space-6) · inner gap 8 (space-2)</div>
  </div>
  <div style="flex:1;padding:var(--space-6);background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-lg)">
    <div style="font-weight:600;color:hsl(var(--text-strong));margin-bottom:var(--space-2)">Layout</div>
    <div style="font-size:13px;color:hsl(var(--text-muted))">sidebar 240 · inspector 300 · header 48 · statusbar 28</div>
  </div>
</div></body></html>
