<!-- @dsCard group="Colors" viewport="700x140" name="Accent — Indigo" subtitle="Single accent; 600 = light solid, 400/500 = dark theme" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .swatches { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid hsl(var(--border-faint)); }
  .sw { flex:1; height:60px; display:flex; align-items:flex-end; padding:6px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 10px; }
</style>
</head>
<body>
<div class="swatches"><div class="sw" style="background:hsl(var(--indigo-100));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.6)">100</span></div><div class="sw" style="background:hsl(var(--indigo-200));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.6)">200</span></div><div class="sw" style="background:hsl(var(--indigo-300));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.6)">300</span></div><div class="sw" style="background:hsl(var(--indigo-400));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.6)">400</span></div><div class="sw" style="background:hsl(var(--indigo-500));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">500</span></div><div class="sw" style="background:hsl(var(--indigo-600));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">600</span></div><div class="sw" style="background:hsl(var(--indigo-700));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">700</span></div><div class="sw" style="background:hsl(var(--indigo-800));"><span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">800</span></div></div>
<div style="display:flex;justify-content:space-between;margin-top:8px" class="meta"><span>--indigo-600 · #3D63DD · solid (light)</span><span>--indigo-400 · #849DFF · accent text (dark)</span></div>
</body></html>
