<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Status" subtitle="Green=valid · amber=warn · red=error, each with a soft wash" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .swatches { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid hsl(var(--border-faint)); }
  .sw { flex:1; height:60px; display:flex; align-items:flex-end; padding:6px; }
  .chip { display:flex; flex-direction:column; gap:6px; }
  .chip .box { height:52px; border-radius:var(--radius-md); border:1px solid hsl(var(--border-faint)); }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .name { font-size:var(--text-xs); color:hsl(var(--text-muted)); }
  .grid { display:grid; gap:12px; }
  .row { display:flex; gap:12px; }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 10px; }
</style>
</head>
<body>
<div class="row">
  
  <div class="chip" style="flex:1">
    <div class="box" style="background:hsl(var(--success))"></div>
    <div class="box" style="height:26px;background:hsl(var(--success-soft))"></div>
    <span class="name">success</span><span class="meta">--success / --success-soft</span>
  </div>
  <div class="chip" style="flex:1">
    <div class="box" style="background:hsl(var(--warning))"></div>
    <div class="box" style="height:26px;background:hsl(var(--warning-soft))"></div>
    <span class="name">warning</span><span class="meta">--warning / --warning-soft</span>
  </div>
  <div class="chip" style="flex:1">
    <div class="box" style="background:hsl(var(--danger))"></div>
    <div class="box" style="height:26px;background:hsl(var(--danger-soft))"></div>
    <span class="name">danger</span><span class="meta">--danger / --danger-soft</span>
  </div>
  <div class="chip" style="flex:1">
    <div class="box" style="background:hsl(var(--info))"></div>
    <div class="box" style="height:26px;background:hsl(var(--info-soft))"></div>
    <span class="name">info</span><span class="meta">--info / --info-soft</span>
  </div>
</div>
</body></html>
