<!-- @dsCard group="Type" viewport="700x180" name="Monospace — JetBrains Mono" subtitle="All code, data, inputs, outputs — IDE-grade legibility" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .swatches { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid hsl(var(--border-faint)); }
  .sw { flex:1; height:60px; display:flex; align-items:flex-end; padding:6px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 10px; }
</style>
</head>
<body>
<div style="display:grid;gap:10px">
  <div style="font-family:var(--font-mono);font-size:var(--text-base);color:hsl(var(--code-key))">"name"<span style="color:hsl(var(--code-punc))">: </span><span style="color:hsl(var(--code-string))">"toolbit"</span><span style="color:hsl(var(--code-punc))">,</span></div>
  <div style="font-family:var(--font-mono);font-size:var(--text-base);color:hsl(var(--code-key))">"localFirst"<span style="color:hsl(var(--code-punc))">: </span><span style="color:hsl(var(--code-keyword))">true</span><span style="color:hsl(var(--code-punc))">,</span> <span style="color:hsl(var(--code-key))">"v"</span><span style="color:hsl(var(--code-punc))">: </span><span style="color:hsl(var(--code-number))">2.0</span></div>
  <div style="font-family:var(--font-mono);font-size:var(--text-sm);color:hsl(var(--text-muted))">0O 1lI {}[]&lt;&gt;=&gt; · designed for IDE reading, unambiguous glyphs</div>
  <div class="meta">JetBrains Mono · 400/500/600 · used for editors, tree views, hashes, kbd</div>
</div></body></html>
