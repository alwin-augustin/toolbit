<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 12px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
</style>
</head>
<body>
<div style="display:flex;gap:22px;padding:8px 0">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div>
      <span class="meta">shadow-sm</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div>
      <span class="meta">shadow-md</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div>
      <span class="meta">shadow-lg</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div>
      <span class="meta">shadow-xl</span>
    </div>
</div></body></html>
