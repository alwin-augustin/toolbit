<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 12px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
</style>
</head>
<body>
<div style="display:grid;gap:10px">
  <div style="font-size:var(--text-lg);font-weight:600;color:hsl(var(--text-strong))">Your data never leaves your device.</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid hsl(var(--border));border-radius:var(--radius-full);font-size:12px"><span style="width:7px;height:7px;border-radius:50%;background:hsl(var(--success));box-shadow:0 0 0 3px hsl(var(--success)/.18)"></span>No network calls made</span>
    <span style="height:26px;padding:0 10px;border:1px solid hsl(var(--border));border-radius:var(--radius-full);font-size:12px;display:inline-flex;align-items:center;color:hsl(var(--text-muted))">No signup. No tracking. Works offline.</span>
  </div>
  <div style="font-size:13px;color:hsl(var(--text-muted))">Verbs first · sentence case · address the user as <b style="color:hsl(var(--text-body))">you</b> · UPPERCASE eyebrows · no emoji in UI</div>
  <div class="meta">"Made with care by developers, for developers"</div>
</div></body></html>
