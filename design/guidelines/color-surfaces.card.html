<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces — Light vs Dark" subtitle="Semantic surface steps in both themes (dark is default)" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .swatches { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid hsl(var(--border-faint)); }
  .sw { flex:1; height:60px; display:flex; align-items:flex-end; padding:6px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 10px; }
</style>
</head>
<body>
<div style="display:flex;gap:12px">
  <div style="flex:1" class="dark">
    <p class="lbl">Dark (default)</p>
    <div style="display:grid;gap:8px;padding:12px;background:hsl(var(--surface-0));border:1px solid hsl(var(--border));border-radius:var(--radius-lg)">
      <div style="padding:10px;background:hsl(var(--surface-1));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-md);color:hsl(var(--text-body));font-size:13px">surface-1 · panel</div>
      <div style="padding:10px;background:hsl(var(--surface-2));border:1px solid hsl(var(--border-faint));border-radius:var(--radius-md);color:hsl(var(--text-body));font-size:13px">surface-2 · card</div>
    </div>
  </div>
  <div style="flex:1">
    <p class="lbl" style="color:hsl(225 5% 50%)">Light</p>
    <div style="display:grid;gap:8px;padding:12px;background:#fff;border:1px solid hsl(223 9% 88%);border-radius:var(--radius-lg)">
      <div style="padding:10px;background:hsl(220 20% 98%);border:1px solid hsl(222 10% 93%);border-radius:var(--radius-md);color:hsl(226 7% 24%);font-size:13px">surface-1 · panel</div>
      <div style="padding:10px;background:hsl(222 14% 96%);border:1px solid hsl(222 10% 93%);border-radius:var(--radius-md);color:hsl(226 7% 24%);font-size:13px">surface-2 · card</div>
    </div>
  </div>
</div>
</body></html>
