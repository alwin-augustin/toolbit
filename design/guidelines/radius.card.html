<!-- @dsCard group="Spacing" viewport="700x160" name="Radius — Sharp & Technical" subtitle="xs 3 · sm 4 · md 6 · lg 8 · xl 12 · full" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .swatches { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid hsl(var(--border-faint)); }
  .sw { flex:1; height:60px; display:flex; align-items:flex-end; padding:6px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 10px; }
</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:18px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="width:64px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-top-left-radius:var(--radius-xs);border-top-right-radius:var(--radius-xs)"></div>
      <span class="meta">xs · 3</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="width:64px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-top-left-radius:var(--radius-sm);border-top-right-radius:var(--radius-sm)"></div>
      <span class="meta">sm · 4</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="width:64px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-top-left-radius:var(--radius-md);border-top-right-radius:var(--radius-md)"></div>
      <span class="meta">md · 6</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="width:64px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-top-left-radius:var(--radius-lg);border-top-right-radius:var(--radius-lg)"></div>
      <span class="meta">lg · 8</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="width:64px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-top-left-radius:var(--radius-xl);border-top-right-radius:var(--radius-xl)"></div>
      <span class="meta">xl · 12</span>
    </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="width:64px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-top-left-radius:var(--radius-2xl);border-top-right-radius:var(--radius-2xl)"></div>
      <span class="meta">2xl · 16</span>
    </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:48px;height:48px;background:hsl(var(--surface-3));border:1px solid hsl(var(--border-strong));border-radius:var(--radius-full)"></div>
    <span class="meta">full</span>
  </div>
</div></body></html>
