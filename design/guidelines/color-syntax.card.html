<!-- @dsCard group="Colors" viewport="700x150" name="Syntax Palette" subtitle="JetBrains-inspired code tokens (not GitHub's scheme)" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:hsl(var(--surface-0)); color:hsl(var(--text-body)); font-family:var(--font-sans); }
  .swatches { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid hsl(var(--border-faint)); }
  .sw { flex:1; height:60px; display:flex; align-items:flex-end; padding:6px; }
  .meta { font-family:var(--font-mono); font-size:var(--text-2xs); color:hsl(var(--text-faint)); }
  .lbl { font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:hsl(var(--text-faint)); margin:0 0 10px; }
</style>
</head>
<body>
<div style="display:flex;gap:12px">
  
  <div style="flex:1;display:grid;gap:6px">
    <div style="height:44px;border-radius:var(--radius-md);border:1px solid hsl(var(--border-faint));background:hsl(var(--surface-1));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:hsl(var(--code-key))">"key"</div>
    <span class="meta">--code-key</span>
  </div>
  <div style="flex:1;display:grid;gap:6px">
    <div style="height:44px;border-radius:var(--radius-md);border:1px solid hsl(var(--border-faint));background:hsl(var(--surface-1));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:hsl(var(--code-string))">"value"</div>
    <span class="meta">--code-string</span>
  </div>
  <div style="flex:1;display:grid;gap:6px">
    <div style="height:44px;border-radius:var(--radius-md);border:1px solid hsl(var(--border-faint));background:hsl(var(--surface-1));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:hsl(var(--code-number))">42.0</div>
    <span class="meta">--code-number</span>
  </div>
  <div style="flex:1;display:grid;gap:6px">
    <div style="height:44px;border-radius:var(--radius-md);border:1px solid hsl(var(--border-faint));background:hsl(var(--surface-1));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:hsl(var(--code-keyword))">true</div>
    <span class="meta">--code-keyword</span>
  </div>
  <div style="flex:1;display:grid;gap:6px">
    <div style="height:44px;border-radius:var(--radius-md);border:1px solid hsl(var(--border-faint));background:hsl(var(--surface-1));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:hsl(var(--code-punc))">{ } : ,</div>
    <span class="meta">--code-punc</span>
  </div>
</div></body></html>
