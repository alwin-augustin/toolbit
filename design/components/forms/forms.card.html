<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: hsl(var(--surface-0)); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; align-items: start; }
  .lbl { display:block; font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: hsl(var(--text-faint)); margin: 0 0 8px; }
  .row { display:flex; align-items:center; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Textarea, Select, Switch, Checkbox } = window.ToolbitDesignSystem_4ae95c;
  function Demo() {
    const [on, setOn] = React.useState(true);
    const [chk, setChk] = React.useState(true);
    return (
      <div className="grid">
        <div>
          <span className="lbl">Input · mono · invalid</span>
          <div style={{display:'grid',gap:10}}>
            <Input placeholder="Search tools..." />
            <Input mono defaultValue="$.store.books[*].title" />
            <Input invalid defaultValue="not-a-uuid" />
          </div>
        </div>
        <div>
          <span className="lbl">Select · Switch · Checkbox</span>
          <div style={{display:'grid',gap:12}}>
            <Select defaultValue="2" fullWidth>
              <option value="2">2 spaces</option>
              <option value="4">4 spaces</option>
              <option value="8">8 spaces</option>
            </Select>
            <div className="row">
              <Switch checked={on} onChange={setOn} />
              <span style={{fontSize:'var(--text-sm)',color:'hsl(var(--text-body))'}}>Network off</span>
            </div>
            <Checkbox checked={chk} onChange={setChk} label="Sort keys alphabetically" />
          </div>
        </div>
        <div style={{gridColumn:'1 / -1'}}>
          <span className="lbl">Textarea (monospace editor)</span>
          <Textarea rows={4} defaultValue={'{\n  "name": "toolbit",\n  "local": true\n}'} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
