<div id="root"></div>
<script type="text/babel">
  const { Tabs, SidebarItem, Badge } = window.ToolbitDesignSystem_4ae95c;

  function Demo() {
    const [seg, setSeg] = React.useState('text');
    const [tab, setTab] = React.useState('format');
    return (
      <div className="split">

          <Tabs variant="underline" value={tab} onChange={setTab} items={[{value:'format',label:'Format'},{value:'query',label:'JSONPath'},{value:'schema',label:'Schema'},{value:'types',label:'Types'}]} />
