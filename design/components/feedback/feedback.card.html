<body>
<div id="root"></div>
<script type="text/babel">
  const { Alert, Toast, Tooltip, Skeleton, IconButton } = window.ToolbitDesignSystem_4ae95c;

  const Dots = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>;
  function Demo() {
    return (
      <div className="split">
        <div>
          <span className="lbl">Alerts</span>
          <div className="stack">
            <Alert tone="warning" icon={<Warn/>}>Large file (2.4MB). Tree view disabled for performance.</Alert>
            <Alert tone="danger" title="Invalid JSON">Unexpected token <code>}</code> at line 4, column 2.</Alert>
            <Alert tone="success" icon={<Check/>}>Formatted successfully — 1,204 lines.</Alert>

        <div>

              <Skeleton width="55%" />
            </div>

  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
