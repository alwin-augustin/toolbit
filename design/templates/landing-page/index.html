<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body { background: hsl(var(--surface-0)); }
  a { transition: color var(--duration-fast) var(--ease-standard); }
  a:hover { color: hsl(var(--text-strong)) !important; }
  /* scroll reveals — entrance-only, inert under reduced motion */
  @media (prefers-reduced-motion: no-preference) {
    .reveal { opacity: 0; transform: translateY(10px); transition: opacity var(--duration-slower) var(--ease-enter), transform var(--duration-slower) var(--ease-enter); }
  }
  .reveal-in { opacity: 1 !important; transform: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="icons.jsx" type="text/babel" data-presets="react"></script>
<script src="MiniWorkspace.jsx" type="text/babel" data-presets="react"></script>
<script src="LandingPage.jsx" type="text/babel" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  const LandingPage = window.TBLandingPage;

  function Page() {
    const [theme, setTheme] = React.useState(() => {
      const saved = localStorage.getItem("tb-marketing-theme");
      if (saved === "dark" || saved === "light") return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    });

    React.useEffect(() => {
      document.documentElement.classList.toggle("dark", theme === "dark");
      localStorage.setItem("tb-marketing-theme", theme);
    }, [theme]);

    // scroll-triggered reveals
    React.useEffect(() => {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("reveal-in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);

    return <LandingPage theme={theme} onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))} />;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
