<!-- @dsCard group="App Workspace" viewport="1440x860" name="Toolbit Workspace" subtitle="IDE-style shell — sidebar, tabs, split editor, inspector, statusbar, ⌘K" -->
<!DOCTYPE html>
<html lang="en" class="dark" data-density="comfortable">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Toolbit — Workspace</title>
<link rel="icon" href="../../assets/favicon-32.png" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: hsl(var(--surface-0)); overflow: hidden; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="icons.jsx" type="text/babel" data-presets="react"></script>
<script src="data.js"></script>
<script src="Sidebar.jsx" type="text/babel" data-presets="react"></script>
<script src="Topbar.jsx" type="text/babel" data-presets="react"></script>
<script src="EditorView.jsx" type="text/babel" data-presets="react"></script>
<script src="Catalog.jsx" type="text/babel" data-presets="react"></script>
<script src="Inspector.jsx" type="text/babel" data-presets="react"></script>
<script src="Statusbar.jsx" type="text/babel" data-presets="react"></script>
<script src="CommandPalette.jsx" type="text/babel" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  const { TBSidebar, TBTopbar, TBEditorView, TBTabStrip, TBCatalog, TBInspector, TBStatusbar, TBCommandPalette } = window;

  function App() {
    const [tabs, setTabs] = React.useState([
      { id: "json-formatter", label: "JSON" },
      { id: "base64-encoder", label: "Base64" },
    ]);
    const [activeTab, setActiveTab] = React.useState("json-formatter");
    const [view, setView] = React.useState({ kind: "tool" }); // or {kind:'catalog', cat}
    const [palette, setPalette] = React.useState(false);
    const [inspector, setInspector] = React.useState(true);
    const [theme, setTheme] = React.useState("dark");
    const [density, setDensity] = React.useState("comfortable");
    const [status, setStatus] = React.useState({ valid: true, bytes: 0, ln: 4, col: 18 });
    const [options, setOptions] = React.useState({ indent: 2, sortKeys: true, validate: true, collapse: false });
    window.TB_OPTIONS = options;

    React.useEffect(() => { document.documentElement.classList.toggle("dark", theme === "dark"); }, [theme]);
    React.useEffect(() => { document.documentElement.dataset.density = density; }, [density]);
    React.useEffect(() => {
      const onKey = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPalette((p) => !p); }
        if (e.key === "Escape") setPalette(false);
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);

    const openTool = (id) => {
      const t = window.TB_TOOLS.find((x) => x.id === id);
      if (!t) return;
      setTabs((prev) => prev.some((x) => x.id === id) ? prev : [...prev, { id, label: t.name.split(" ")[0] }]);
      setActiveTab(id);
      setView({ kind: "tool" });
    };
    const closeTab = (id) => {
      setTabs((prev) => {
        const next = prev.filter((t) => t.id !== id);
        if (activeTab === id && next.length) setActiveTab(next[next.length - 1].id);
        return next;
      });
    };
    const toolName = (window.TB_TOOLS.find((t) => t.id === activeTab) || {}).name || "JSON Formatter";

    return (
      <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
        <TBSidebar activeId={view.kind === "tool" ? activeTab : null} activeCat={view.kind === "catalog" ? view.cat : null}
          onTool={openTool} onCategory={(cat) => setView({ kind: "catalog", cat })} onSearch={() => setPalette(true)} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
          <TBTopbar crumb={view.kind === "catalog" ? ["Tool Library", (window.TB_CATEGORIES.find(c=>c.id===view.cat)||{}).label] : ["API Debug", toolName]}
            density={density} onDensity={setDensity}
            onToggleInspector={() => setInspector((v) => !v)}
            theme={theme} onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
            onRun={() => {}} />
          {view.kind === "tool" ? (
            <React.Fragment>
              <TBTabStrip tabs={tabs} activeTab={activeTab} onTab={(id) => setActiveTab(id)} onClose={closeTab} onAdd={() => setPalette(true)} />
              {activeTab === "json-formatter" ? (
                <TBEditorView key={JSON.stringify(options)} onStatus={(s) => setStatus((p) => ({ ...p, ...s }))} />
              ) : (
                <GenericTool id={activeTab} />
              )}
            </React.Fragment>
          ) : (
            <TBCatalog catId={view.cat} onTool={openTool} />
          )}
          <TBStatusbar status={status} />
        </div>
        {inspector && view.kind === "tool" && activeTab === "json-formatter" && (
          <TBInspector onClose={() => setInspector(false)} options={options} onOptions={setOptions} />
        )}
        <TBCommandPalette open={palette} onClose={() => setPalette(false)} onSelect={openTool} />
      </div>
    );
  }

  function GenericTool({ id }) {
    const t = window.TB_TOOLS.find((x) => x.id === id) || {};
    const Icon = window.TBIcon;
    const cat = window.TB_CATEGORIES.find((c) => c.id === t.cat) || {};
    return (
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center", maxWidth: 380 }}>
          <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 44, height: 44, borderRadius: "var(--radius-lg)", background: "hsl(var(--primary-soft))", color: "hsl(var(--primary))", marginBottom: 12 }}><Icon name={cat.icon || "hash"} size={22} /></span>
          <div style={{ fontSize: "var(--text-md)", fontWeight: "var(--weight-semibold)", color: "hsl(var(--text-strong))", marginBottom: 6 }}>{t.name}</div>
          <p style={{ fontSize: "var(--text-sm)", color: "hsl(var(--text-muted))" }}>{t.desc}. This mock implements the JSON Formatter end-to-end; other tools share the same split-editor layout.</p>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
